specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Envato
providerId: envato
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
- Stock Media
- Marketplace
- Themes
- Audio
- Video
- Graphics
- Subscription
- Rate Limiting
- Quotas
- Throttling
description: >-
  Envato Market API enforces per-app rate limits and returns standard rate-limit headers.
  Documentation does not publish exact RPS thresholds; bursting is throttled with HTTP 429.
notes: Per-app limits; specific thresholds not publicly documented.
sources:
- https://build.envato.com/api/
responseCodes:
  throttled: 429
limits:
- name: Per app
  scope: application
  metric: requests
  limit: see provider documentation
  notes: Per-app throttle; returns 429.
policies:
- name: Backoff Strategy
  description: On 429, apply exponential backoff with jitter.
- name: Caching
  description: Cache catalog responses; metadata is reasonably stable.
maintainers:

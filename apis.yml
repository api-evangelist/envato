name: Envato

kind: company

description: Envato runs Envato Market (per-asset marketplaces like ThemeForest, CodeCanyon, AudioJungle, VideoHive, GraphicRiver, 3DOcean, PhotoDune)
  and Envato Elements (subscription-based unlimited stock media). The Envato API exposes Market endpoints for items, search, downloads, user accounts,
  and earnings, documented at build.envato.com; Elements runs an affiliate program, but no public affiliate API documentation was found as of
  2026-10.


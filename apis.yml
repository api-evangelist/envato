- aid: envato:elements-affiliate
  name: Envato Elements Affiliate API
  description: >-
    Affiliate-only API for Envato Elements (subscription-based stock media). Provides search and metadata
    for catalog discovery within affiliate properties; not a general-purpose download API.
  humanURL: https://elements.envato.com/affiliates

# x-archived-from: envato-openapi.yml
# x-archived-on: 2026-10-21
openapi: 3.0.0
info:
  title: Envato API
  version: '0.1'
  description: Envato Market API, normalized from the provider-published API description at https://api.envato.com/api-docs
    (loaded by the official docs at https://build.envato.com/api/). Per-path basePath values were folded into the paths; operations
    are otherwise verbatim. The published document references definitions it does not include (AliasUsername, Categories,
    CommentResults, EarningsAndSalesByMonth, Email, Features, ItemPrices, NewFiles, NewFilesFromUser, NumberOfFiles, Popular,
    RandomNewFiles, Result, Result_SimpleEntity, TotalItems, TotalUsers, User, UserAccount, UserItemsBySite, Username); those
    schemas are left open and marked x-unresolved-ref rather than invented.
  x-source: https://api.envato.com/api-docs
  x-ownership: Served from api.envato.com and loaded by Envato's own API docs at build.envato.com/api/; basePath https://api.envato.com
    and the OAuth authorizationUrl https://api.envato.com/authorization both point at Envato.
security:
- oauth2:
  - default
  - user:username
  - user:email
  - user:account
  - user:financial
  - purchase:download
  - sale:history
  - sale:verify
  - purchase:list
  - purchase:verify
  - purchase:history
  - user:favourite_collection_add
  - user:collections
  - user:statement
  - stat:total_users
  - stat:total_items
  - stat:total_community_earnings
  - stat:total_items_sold
paths:
  /v1/discovery/search/search/more_like_this:
    get:
      description: Find similar items
      parameters:
      - in: query
        name: item_id
        description: The item id to find similar items for
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: page
        description: Page number (max. 60)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
      - in: query
        name: page_size
        description: Number of items per page (max. 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Find similar items
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/Result_SimpleEntity'
      tags:
      - search
      operationId: getSearchMoreLikeThis
  /v1/discovery/search/search/comment:
    get:
      description: Search for comments
      parameters:
      - in: query
        name: item_id
        description: The item id to search for comments on
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: term
        description: The search phrase to find
        required: false
        schema:
          type: string
      - in: query
        name: page
        description: Page number (max. 60)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
      - in: query
        name: page_size
        description: Number of items per page (max. 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
      - in: query
        name: sort_by
        required: false
        schema:
          type: string
          enum:
          - relevance
          - newest
          - oldest
      responses:
        '200':
          description: Search for comments
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/CommentResults'
      tags:
      - search
      operationId: getSearchComment
  /v1/discovery/search/search/item:
    get:
      description: Search for items
      parameters:
      - in: query
        name: term
        description: The string to search for
        required: false
        schema:
          type: string
      - in: query
        name: site
        description: The site to match.
        required: false
        schema:
          type: string
          enum:
          - ''
          - themeforest.net
          - photodune.net
          - codecanyon.net
          - videohive.net
          - audiojungle.net
          - graphicriver.net
          - 3docean.net
      - in: query
        name: tags
        description: Comma separated list of tags to match
        required: false
        schema:
          type: string
      - in: query
        name: category
        description: Category code to search for
        required: false
        schema:
          type: string
      - in: query
        name: platform
        description: The platform to match
        required: false
        schema:
          type: string
      - in: query
        name: compatible_with
        description: Frameworks or compatible software to match
        required: false
        schema:
          type: string
      - in: query
        name: colors
        description: Comma separated list of colors to match
        required: false
        schema:
          type: string
      - in: query
        name: sizes
        description: Comma separated list of sizes to match
        required: false
        schema:
          type: string
      - in: query
        name: size
        description: A minimum photo size to match
        required: false
        schema:
          type: string
          enum:
          - ''
          - xs
          - s
          - m
          - l
          - xl
          - xxl
      - in: query
        name: sales
        description: Name of the sales bucket to filter by (see the aggregation sales result)
        required: false
        schema:
          type: string
      - in: query
        name: rating_min
        description: Minimum rating to filter by
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: price_min
        description: Minimum price to include, in whole dollars
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: price_max
        description: Maximum price to include, in whole dollars
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: poly_count
        description: Preferred polygon count. Either a single polygon count or a range separated by `-`
        required: false
        schema:
          type: string
      - in: query
        name: item_type
        description: The item type to match
        required: false
        schema:
          type: string
      - in: query
        name: suggest
        description: Whether to include search suggestions
        required: false
        schema:
          type: boolean
      - in: query
        name: date
        description: Restrict items by original uploaded date
        required: false
        schema:
          type: string
          enum:
          - ''
          - this-year
          - this-month
          - this-week
          - this-day
      - in: query
        name: date_updated
        description: Restrict items by updated date
        required: false
        schema:
          type: string
          enum:
          - ''
          - this-year
          - this-month
          - this-week
          - this-day
      - in: query
        name: length_min
        description: Minimum video or audio length in the form, in seconds
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: length_max
        description: Maximum video or audio length in the form, in seconds
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: tempo
        description: One of very-slow, slow, medium, upbeat, fast and very-fast
        required: false
        schema:
          type: string
      - in: query
        name: alpha
        description: Does the graphic include an alpha mask
        required: false
        schema:
          type: boolean
      - in: query
        name: vocals_in_audio
        description: 'The type of vocal content in audio files, comma separated, valid values: ''background vocals'', ''background
          vocals/harmonies'', ''lead vocals'', ''instrumental version included'', ''vocal samples'', ''no vocals'''
        required: false
        schema:
          type: string
      - in: query
        name: looped
        description: Does the item loop seamlessly
        required: false
        schema:
          type: boolean
      - in: query
        name: orientation
        description: Image or video orientation to match
        required: false
        schema:
          type: string
          enum:
          - ''
          - landscape
          - portrait
          - square
      - in: query
        name: requires_plugins
        description: Restrict to items that do or don't require plugins
        required: false
        schema:
          type: string
          enum:
          - ''
          - T
          - F
      - in: query
        name: resolution_min
        description: The minimum resolution for video content
        required: false
        schema:
          type: string
          enum:
          - ''
          - 720p
          - 1080p
          - 2K
          - 4K
      - in: query
        name: frame_rate
        description: Match a particular FPS value for video content
        required: false
        schema:
          type: string
      - in: query
        name: page
        description: Page number (max. 60)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
      - in: query
        name: page_size
        description: Number of items per page (max. 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
      - in: query
        name: attribute_key
        description: 'The name of the attribute to search by, eg: compatible-with'
        required: false
        schema:
          type: string
      - in: query
        name: attribute_value
        description: 'The attribute value to match, eg: Wordpress 3.5'
        required: false
        schema:
          type: string
      - in: query
        name: username
        description: Username to restrict by
        required: false
        schema:
          type: string
      - in: query
        name: sort_by
        description: 'Sort by one of the following: relevance, rating, sales, price, date, updated, category, name, trending,
          featured_until'
        required: false
        schema:
          type: string
          enum:
          - ''
          - relevance
          - rating
          - sales
          - price
          - date
          - updated
          - category
          - name
          - trending
          - featured_until
          - random
      - in: query
        name: sort_direction
        description: 'Sort direction. One of: asc, desc'
        required: false
        schema:
          type: string
          enum:
          - ''
          - asc
          - desc
      responses:
        '200':
          description: Search for items
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/Result'
      tags:
      - search
      operationId: getSearchItem
  /v1/market/number-of-files:{site}.json:
    get:
      summary: Number of files per category
      description: Shows the number of files in the major categories of a particular site. Requires a site parameter, e.g.
        number-of-files:themeforest
      operationId: getNumberOfFiles
      parameters:
      - name: site
        in: path
        description: Site name, eg. themeforest
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Number of files response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/NumberOfFiles'
  /v1/market/total-users.json:
    get:
      summary: Total number of users
      description: Shows the total number of subscribed users on Envato Market
      operationId: getTotalUsers
      responses:
        '200':
          description: Total users response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/TotalUsers'
  /v1/market/total-items.json:
    get:
      summary: Total number of items
      description: Shows the total number of items available on Envato Market
      operationId: getTotalItems
      responses:
        '200':
          description: Total items response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/TotalItems'
  /v1/market/item-prices:{item_id}.json:
    get:
      summary: Item prices
      description: Return available licenses and prices for the given item ID
      operationId: getItemPrices
      parameters:
      - name: item_id
        in: path
        description: Item id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Item prices response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/ItemPrices'
  /v1/market/user:{username}.json:
    get:
      summary: User details
      description: Shows username, country, number of sales, number of followers, location and image for a user. Requires
        a username, e.g. collis
      operationId: getUser
      parameters:
      - name: username
        in: path
        description: Username
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/User'
  /v1/market/user-items-by-site:{username}.json:
    get:
      summary: User items by site
      description: Show the number of items an author has for sale on each site. Requires a username, e.g. collis
      operationId: getUserItemsBySite
      parameters:
      - name: username
        in: path
        description: Username
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/UserItemsBySite'
  /v1/market/popular:{site}.json:
    get:
      summary: Popular files
      description: Returns the popular files for a particular site. Requires a site parameter, e.g. popular:themeforest
      operationId: getPopular
      parameters:
      - name: site
        in: path
        description: Site name, eg. themeforest
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Popular response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/Popular'
  /v1/market/categories:{site}.json:
    get:
      summary: Categories for site
      description: Lists the categories of a particular site. Requires a site parameter, e.g. themeforest
      operationId: getCategories
      parameters:
      - name: site
        in: path
        description: Site name, eg. themeforest
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Categories response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/Categories'
  /v1/market/features:{site}.json:
    get:
      summary: Features for site
      description: Shows the current site features.
      operationId: getFeatures
      parameters:
      - name: site
        in: path
        description: Site name, eg. themeforest
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Features response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/Features'
  /v1/market/new-files:{site},{category}.json:
    get:
      summary: New files for site
      description: New files, recently uploaded to a particular site. Requires site and category parameters, e.g. new-files:themeforest,site-templates
        or new-files:graphicriver,graphics
      operationId: getNewFiles
      parameters:
      - name: site
        in: path
        description: Site name, eg. themeforest
        required: true
        schema:
          type: string
      - name: category
        in: path
        description: Category, eg. site-templates
        required: true
        schema:
          type: string
      responses:
        '200':
          description: New files response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/NewFiles'
  /v1/market/new-files-from-user:{username},{site}.json:
    get:
      summary: New files for user
      description: Shows up to 1000 newest files uploaded by a user to a particular site. Requires username and site parameters,
        e.g. new-files-from-user:collis,themeforest
      operationId: getNewFilesFromUser
      parameters:
      - name: site
        in: path
        description: Site name, eg. themeforest
        required: true
        schema:
          type: string
      - name: username
        in: path
        description: Username, eg. collis
        required: true
        schema:
          type: string
      responses:
        '200':
          description: New files from user response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/NewFilesFromUser'
  /v1/market/random-new-files:{site}.json:
    get:
      summary: Random new files for site
      description: Shows a random list of newly uploaded files from a particular site. Requires a site parameter, e.g. random-new-files:themeforest
      operationId: getRandomNewFiles
      parameters:
      - name: site
        in: path
        description: Site name, eg. themeforest
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Random New files response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/RandomNewFiles'
  /v1/market/user-badges:{username}.json:
    get:
      summary: User badges
      description: Shows a list of badges for the given user
      operationId: getUserBadges
      parameters:
      - name: username
        in: path
        description: Username
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User badges response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/User'
  /v1/market/private/user/earnings-and-sales-by-month.json:
    get:
      summary: Monthly sales
      description: Returns the monthly sales data, as displayed on the user's earnings page. Monthly sales data ("Earnings")
        is reported before subtraction of any income taxes (eg US Royalty Withholding Tax).
      operationId: getUserEarningsAndSalesByMonth
      responses:
        '200':
          description: Earnings and sales by month response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/EarningsAndSalesByMonth'
  /v1/market/private/user/account.json:
    get:
      summary: Account details
      description: Returns the first name, surname, earnings available to withdraw, total deposits, balance (deposits + earnings)
        and country.
      operationId: getUserAccount
      responses:
        '200':
          description: Account response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/UserAccount'
  /v1/market/private/user/username.json:
    get:
      summary: Username
      description: Returns the currently logged in user's Envato Account username
      operationId: getUserUsername
      responses:
        '200':
          description: Username response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/Username'
  /v1/market/private/user/alias_username.json:
    get:
      summary: Alias username
      description: Returns the currently logged in user's FTP alias username, or an empty string when unset
      operationId: getUserAliasUsername
      responses:
        '200':
          description: Alias username response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/AliasUsername'
  /v1/market/private/user/email.json:
    get:
      summary: Email
      description: Returns the currently logged in user's Envato Account email
      operationId: getUserEmail
      responses:
        '200':
          description: Email response
          content:
            application/json:
              schema:
                type: object
                x-unresolved-ref: '#/definitions/Email'
  /v3/market/author/sales:
    get:
      summary: Author's Sales
      description: Lists all unrefunded sales of the authenticated user's items listed on Envato Market. Author sales data
        ("Amount") is reported before subtraction of any income taxes (eg US Royalty Withholding Tax).
      operationId: getAuthorSales
      parameters:
      - name: page
        in: query
        description: A page number to start the results from
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Author sales response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketPurchaseForAuthor'
  /v3/market/author/sale:
    get:
      summary: An Author's Sale
      description: Returns the details of an author's sale identified by the purchase code. Author sales data ("Amount") is
        reported before subtraction of any income taxes (eg US Royalty Withholding Tax).
      operationId: getAuthorSale
      parameters:
      - name: code
        in: query
        description: The unique code of the sale to return
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Author sale response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorSale'
  /v3/market/buyer/download:
    get:
      summary: Download purchased items
      description: Download purchased items by either the item_id or the purchase_code. Each invocation of this endpoint will
        count against the items daily download limit.
      operationId: getBuyerDownload
      parameters:
      - name: item_id
        in: query
        description: The numeric ID of the item to download
        required: false
        schema:
          type: integer
          format: int32
      - name: purchase_code
        in: query
        description: The purchase code of the item to download
        required: false
        schema:
          type: string
      - name: shorten_url
        in: query
        description: Attempt to shorten URL
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Buyer download response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
  /v3/market/buyer/list-purchases:
    get:
      summary: List purchases
      description: List purchases
      operationId: getBuyerListPurchases
      parameters:
      - name: filter_by
        in: query
        description: One of wordpress-themes or wordpress-plugins
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          format: int32
      - name: include_all_item_details
        in: query
        description: Include more item details
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: List purchases response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketPurchaseForBuyer'
  /v3/market/buyer/purchase:
    get:
      summary: Purchase details
      description: Returns the details of a user's purchase identified by the purchase code
      operationId: getBuyerPurchase
      parameters:
      - name: code
        in: query
        description: The unique code of the purchase to return
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Purchase response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPurchaseForBuyer'
  /v3/market/buyer/purchases:
    get:
      summary: List all purchases author's items
      description: Lists all purchases that the authenticated user has made of the app creator's listed items
      operationId: getBuyerPurchases
      parameters:
      - name: page
        in: query
        description: A page number to start the results from
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Purchases response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketPurchaseForBuyer'
  /v3/market/catalog/collection:
    get:
      summary: Public collection details
      description: Returns details of, and items contained within, a public collection
      operationId: getCatalogCollection
      parameters:
      - name: id
        in: query
        description: The numeric ID of the collection to return
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetails'
  /v3/market/catalog/item-version:
    get:
      summary: Latest theme/plugin version
      description: "Returns the latest available version of a theme/plugin.\n This is the recommended endpoint for Wordpress\
        \ theme/plugin authors building an auto-upgrade\n system into their item that needs to check if a new version is available.\n"
      operationId: getCatalogItemVersion
      parameters:
      - name: id
        in: query
        description: The numeric ID of the item
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Item version response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemVersion'
  /v3/market/catalog/item:
    get:
      summary: Item details
      description: Returns all details of a particular item on Envato Market
      operationId: getCatalogItem
      parameters:
      - name: id
        in: query
        description: The numeric ID of the item to return
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Item response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
  /v3/market/user/bookmark_add:

description: >-
  FOCUS-aligned FinOps profile for Envato. Cost is per-asset (Market) or subscription (Elements). The
  Market API itself is free; purchases happen on the marketplace via the standard checkout. Elements
  is invoiced monthly/annually. Optimize Elements by matching seat tier to active users and
  consolidating Market purchases under a single buyer account for reporting.
notes: "Two cost paths: Market per-asset and Elements subscription."

principles:
- name: Visibility
  description: Centralize Market purchases under one buyer account; pull Elements seat report monthly.
- name: Allocation
  description: Allocate Market purchases to project; Elements seats to consuming creative team.
- name: Optimization
  description: Use Elements for high-volume creative; reserve Market purchases for one-off items not on Elements.
- name: Accountability
  description: Creative ops owns Elements; product/dev owns Market app credentials and purchase reconciliation.

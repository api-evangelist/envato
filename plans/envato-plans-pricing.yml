specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Envato
providerId: envato
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- Stock Media
- Marketplace
- Themes
- Audio
- Video
- Graphics
- Subscription
- Plans
description: >-
  Envato Market is per-asset (buyers pay per item; authors take a revenue share). Envato Elements is a
  subscription with unlimited downloads of covered media for active subscribers. The Market API itself
  is free for registered apps; per-asset purchases happen on the marketplace. Elements affiliate API
  is free for approved affiliates.
notes: "Two product lines: Market (per-asset) and Elements (subscription). Market API is free; purchases are per-asset."
sources:
- https://build.envato.com/api/
- https://elements.envato.com/
- https://themeforest.net/
plans:
- id: envato-market-api
  name: Envato Market API
  type: free
  description: Free OAuth/personal-token API access. Buyers pay per asset on the marketplace.
  entries:
  - label: API Access
    name: api_access
    type: flat
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: 0
    userMultiplied: false
  elements:
  - name: OAuth 2.0
  - name: Personal tokens
  - name: Per-asset purchases handled on marketplace
- id: envato-elements-subscription
  name: Envato Elements Subscription
  type: subscription
  description: Subscription for unlimited downloads of covered media (templates, stock photos/video, audio, fonts).
  entries:
  - label: Subscription
    name: subscription
    type: flat
    metric: month
    limit: -1
    timeFrame: monthly
    geo: global
    unit: 1
    price: see https://elements.envato.com/pricing
    userMultiplied: false
  elements:
  - name: Individual, Teams, Enterprise tiers
  - name: Affiliate API available to partners
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com

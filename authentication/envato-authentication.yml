- name: oauth2
  type: oauth2
  description: >-
    "The Envato Market API supports the full OAuth authentication flow, so that you can allow users of
    your app to sign in with their Envato Account in order to access the API on their behalf." Apps are
    registered at https://build.envato.com/my-apps with the permissions they need.
  flows:
